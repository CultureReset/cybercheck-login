name: GCR Database Dump

# Read-only dump of every table attached to every slug, one file per business.
# Run it from the Actions tab -> GCR Database Dump -> Run workflow.

on:
  workflow_dispatch:
  push:
    branches: [claude/cybercheck-db-schema-2xg28o]
    paths:
      - '.github/workflows/gcr-dump.yml'
      - 'scripts/gcr-dump.js'

jobs:
  dump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run the dump
        run: node scripts/gcr-dump.js

      - name: Commit results back to the branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A gcr-dump
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "GCR database dump: one file per slug [skip ci]"
            git pull --rebase origin ${GITHUB_REF_NAME} || true
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Upload as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: gcr-dump
          path: gcr-dump/
          retention-days: 90

      - name: Summary
        run: |
          echo "### GCR Dump complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Business files: $(ls gcr-dump/data-by-slug 2>/dev/null | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Browse them at: gcr-dump/data-by-slug/" >> $GITHUB_STEP_SUMMARY
          if [ -f gcr-dump/FAILED-tables.txt ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Tables blocked by RLS (need service_role key):" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat gcr-dump/FAILED-tables.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
